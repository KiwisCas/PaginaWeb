<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlas Corp Recruitment</title>
  <!-- Fuente Pixelada (Press Start 2P) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- PANTALLA DE INICIO / CARGA -->
  <div id="start-screen">
    <!-- Estado de Precarga -->
    <div id="loading-box">
      <p id="loading-text" class="pixel-text">CARGANDO RECURSOS... 0%</p>
      <div class="load-bar-container">
        <div id="load-bar"></div>
      </div>
    </div>

    <!-- Botón de Inicio (se activa al completar la carga) -->
    <button class="primary pixel-text" id="initBtn" style="display: none;">Te necesitamos!! Haz clic acá</button>
  </div>

  <!-- CONTENEDOR PRINCIPAL DEL JUEGO -->
  <div id="game-container">
    <h1>Atlas Corp Recruitment</h1>
    <div id="player">
      <div id="hud"><span id="sceneLabel" class="pixel-text">—</span></div>
      <div style="position:relative">
        <video id="video" playsinline></video>
        <div id="overlay"></div>
      </div>
    </div>
  </div>

  <!-- PANTALLA FINAL -->
  <div id="end">
    <button class="primary pixel-text" onclick="location.reload()">Reiniciar</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
